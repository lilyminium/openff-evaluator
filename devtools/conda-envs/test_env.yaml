name: test
channels:
  - conda-forge
dependencies:
    # Base depends
  - python ==3.9
  - pip

    # Testing and development
  - pytest
  - pytest-cov
  - codecov

    # Standard dependencies
  - cython ==0.29.36
  - openff-toolkit ==0.10.6
  - openff-units ==0.1.4
  - smirnoff99frosst
  - numpy
  - pandas
  - openmm ==7.7
  - networkx
  - pint ==0.17
  - packmol
  - pymbar >=3.0.5
  - dask >=2.7.0
  - distributed >=2.7.0
  - dask-jobqueue >=0.7.0
  - coverage >=4.4
  - uncertainties
  - openmmtools ==0.21.5
  - yank >=0.25.2
  - pyyaml
  - requests
  - requests-mock # For testing http requests.
  - rdkit
  - cmiles
  - python-dateutil
  - pydantic
  - paprika
  - taproom
  - dataclasses
  - smirnoff-plugins # For testing custom nonbonded forces
  # manually installed by cloning and with python setup.py install
  # - pip:
  #   - pip install git+https://github.com/lilyminium/mdtraj@v1.9.8-fix-integer
